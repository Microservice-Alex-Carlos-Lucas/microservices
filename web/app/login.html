<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Microservices</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252836;
      --border: #2e3248;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --success: #3ecf8e;
      --danger: #f87171;
      --text: #e2e8f0;
      --muted: #6b7280;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .card-header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .card-header h1 { font-size: 18px; font-weight: 600; }
    .card-header p  { font-size: 13px; color: var(--muted); }

    .card-body {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      padding: 11px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: var(--font);
      transition: background .15s, transform .1s;
      width: 100%;
    }

    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .error-msg {
      display: none;
      background: #3a1a1a;
      border: 1px solid #f8717155;
      color: var(--danger);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .footer-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 0 28px 24px;
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">⚙</div>
    <div>
      <h1>Entrar</h1>
      <p>Microservices — Auth</p>
    </div>
  </div>

  <div class="card-body">
    <div id="error-msg" class="error-msg"></div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="joao@email.com" autocomplete="email" />
    </div>

    <div class="field">
      <label>Senha</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') login()" />
    </div>

    <button class="btn btn-primary" onclick="login()">Entrar</button>
  </div>

  <div class="footer-link">
    Nao tem conta? <a href="register.html">Criar conta</a>
  </div>
</div>

<script src="store.js"></script>
<script>
  // If already logged in, skip to main page
  if (getToken()) window.location.href = "index.html";
</script>
</body>
</html>
